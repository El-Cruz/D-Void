<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#000}
body{overflow-x:hidden}
a{color:#EDC677;text-decoration:none}a:hover{color:#DC3A16}
.cover{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(30px,5vh,56px);padding:clamp(44px,7vh,80px) 24px}
.bg{position:absolute;inset:-4%;background:url("ac7c9d11-3933-4fb8-8596-9386e73dbd90") center/cover no-repeat;animation:bgdrift 26s ease-in-out infinite alternate;filter:saturate(1.05)}
@keyframes bgdrift{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-1.5%,1%)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.58) 100%)}
canvas.embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.logo{position:relative;z-index:3;width:min(620px,80vw);mix-blend-mode:screen;opacity:0;animation:logoin 2.4s ease .3s forwards;will-change:transform}
@keyframes logoin{0%{opacity:0;filter:blur(14px)}100%{opacity:1;filter:blur(0)}}

.cartelera{position:relative;z-index:4;width:100%;max-width:420px;opacity:0;animation:actin 1.4s ease .85s forwards}
.cartelera .head{display:flex;align-items:center;gap:12px;margin:0 4px 14px;font-family:'Inter Tight',ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(237,198,119,.9);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.cartelera .head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(237,198,119,.45),transparent)}
.rail{display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab}
.rail:active{cursor:grabbing}
.rail::-webkit-scrollbar{display:none}
.track{display:flex;gap:12px;margin:0 auto;padding:4px 0 10px}
.flyer{position:relative;flex:0 0 calc((100vw - 0px)*0);scroll-snap-align:center;border:1px solid rgba(237,198,119,.32);background:rgba(0,0,0,.4);cursor:pointer;overflow:hidden;transition:border-color .35s,transform .5s cubic-bezier(.2,.8,.2,1)}
.flyer{flex-basis:132px}
.flyer img{display:block;width:100%;height:auto;opacity:.92;transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
.flyer .day{position:absolute;top:0;left:0;padding:6px 10px;background:rgba(0,0,0,.72);font-family:'Inter Tight',sans-serif;font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#EDC677}
.flyer .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(242,226,190,.28) 50%,transparent 62%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.flyer:hover{border-color:#DC3A16;transform:translateY(-4px)}
.flyer:hover img{opacity:1;transform:scale(1.04)}
.flyer:hover .sheen{transform:translateX(120%)}
.dots{display:flex;justify-content:center;gap:7px;margin-top:2px}
.dots.hide{display:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(242,226,190,.3);transition:background .3s,width .3s}
.dots i.on{background:#DC3A16;width:18px;border-radius:3px}

.actions{position:relative;z-index:4;display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;opacity:0;animation:actin 1.4s ease 1.1s forwards}
@keyframes actin{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.btn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:16px 26px;border:1px solid rgba(242,226,190,.45);border-radius:999px;font-family:'Inter Tight',ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#F2E2BE;background:rgba(0,0,0,.32);overflow:hidden;transition:color .35s,border-color .35s}
.btn span{position:relative;z-index:2}
.btn .ar{position:relative;z-index:2;width:18px;height:1px;background:currentColor;flex:none;transition:width .35s}
.btn .ar::after{content:"";position:absolute;right:-1px;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.btn::before{content:"";position:absolute;inset:0;background:#DC3A16;transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:1}
.btn:hover{color:#FCF8F0;border-color:#DC3A16}
.btn:hover::before{transform:translateY(0)}
.btn:hover .ar{width:26px}
.btn.primary{border-color:#DC3A16;color:#FCF8F0;background:rgba(220,58,22,.16)}
.btn.primary::before{background:#9E1B19}

.grain{position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMDAnIGhlaWdodD0nMjAwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHZhbHVlcz0nMCAwIDAgMCAxIDAgMCAwIDAgMSAwIDAgMCAwIDEgMCAwIDAgMC42IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=")}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 16px 20px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;display:block}
.lb-cta{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;min-height:54px;padding:15px 34px;border:1px solid #DC3A16;border-radius:999px;background:rgba(220,58,22,.18);font-family:'Inter Tight',sans-serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#FCF8F0;cursor:pointer;overflow:hidden;position:relative;transition:color .35s}
.lb-cta span,.lb-cta .ar{position:relative;z-index:2}
.lb-cta .ar{width:18px;height:1px;background:currentColor;flex:none;transition:width .35s}
.lb-cta .ar::after{content:"";position:absolute;right:-1px;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.lb-cta::before{content:"";position:absolute;inset:0;background:#9E1B19;transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:1}
.lb-cta:hover::before{transform:translateY(0)}
.lb-cta:hover .ar{width:26px}
.lightbox .close{position:fixed;top:16px;right:18px;z-index:2;font-family:'Inter Tight',sans-serif;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#F2E2BE;border:1px solid rgba(242,226,190,.4);border-radius:999px;padding:10px 18px;background:rgba(0,0,0,.6)}
.promo{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.promo.on{opacity:1;visibility:visible}
.promo .pcard{display:flex;flex-direction:column;align-items:center;gap:16px;transform:translateY(30px) scale(.94) rotate(-1deg);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.promo.on .pcard{transform:translateY(0) scale(1) rotate(0)}
.promo a.pflyer{position:relative;display:block;line-height:0;border:1px solid rgba(220,58,22,.5);box-shadow:0 30px 80px rgba(0,0,0,.75);overflow:hidden;animation:pborde 3.2s ease-in-out infinite}
.promo .pflyer img{width:auto;height:auto;max-width:min(380px,84vw);max-height:min(66vh,66svh);display:block}
.promo .pflyer::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(242,226,190,.28) 50%,transparent 62%);transform:translateX(-130%)}
.promo.on .pflyer::after{animation:psheen 4.4s cubic-bezier(.2,.8,.2,1) 1.2s infinite}
.promo.on .pflyer img{animation:pfloat 7s ease-in-out 1s infinite}
.promo .ptag,.promo .lb-cta{opacity:0;translate:0 12px;transition:opacity .5s,translate .5s}
.promo .ptag{transition-delay:.3s;font-family:'Inter Tight',sans-serif;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(237,198,119,.9)}
.promo .lb-cta{transition-delay:.5s}
.promo.on .ptag,.promo.on .lb-cta{opacity:1;translate:0 0}
.promo.on .lb-cta{animation:pglow 3s ease-in-out 1.4s infinite}
@keyframes pfloat{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.02) rotate(.4deg)}}
@keyframes psheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes pborde{0%,100%{border-color:rgba(220,58,22,.5);box-shadow:0 30px 80px rgba(0,0,0,.75)}50%{border-color:rgba(237,198,119,.85);box-shadow:0 30px 90px rgba(237,198,119,.25)}}
@keyframes pglow{0%,100%{box-shadow:0 0 0 rgba(220,58,22,0)}50%{box-shadow:0 8px 34px rgba(220,58,22,.55)}}
@media (prefers-reduced-motion:reduce){.promo *{animation:none !important;transition:none !important}.promo .ptag,.promo .lb-cta{opacity:1;translate:0 0}}
@media (max-width:520px){.cover{gap:26px;padding:56px 18px 44px}.logo{width:84vw}.btn{min-height:52px;padding:14px 20px;font-size:11px;letter-spacing:.14em}.actions{max-width:100%}.cartelera{max-width:100%}.cartelera .head{font-size:9px;letter-spacing:.26em}.flyer{flex-basis:46vw}.lightbox{padding:58px 12px 16px}.lightbox img{max-height:calc(100vh - 140px)}.lb-cta{min-height:50px;padding:14px 26px;font-size:11px;letter-spacing:.18em}}
</style>

<script>
(function(){
var pausar=false;
var cv=document.querySelector('.embers'),ctx=cv.getContext('2d'),w,h,dpr=1;
function rs(){w=cv.width=innerWidth*dpr;h=cv.height=innerHeight*dpr}
rs();addEventListener('resize',rs);
var P=[];for(var i=0;i<45;i++)P.push(np(true));
function np(any){return{x:Math.random()*w,y:any?Math.random()*h:h+20,vx:(Math.random()-.5)*.3,vy:-Math.random()*.7-.2,r:Math.random()*2+.5,l:0,ml:Math.random()+.5,g:Math.random()>.7}}
function tick(){
if(pausar||document.hidden){requestAnimationFrame(tick);return}
ctx.clearRect(0,0,w,h);
for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.l+=.005;
if(p.l>p.ml||p.y<-20){P[i]=np(false);continue}
var a=Math.sin(p.l/p.ml*Math.PI)*.7,R=p.r*6;
var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
if(p.g){g.addColorStop(0,'rgba(237,198,119,'+a+')');g.addColorStop(1,'rgba(237,198,119,0)')}
else{g.addColorStop(0,'rgba(220,58,22,'+a+')');g.addColorStop(1,'rgba(220,58,22,0)')}
ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill()}
requestAnimationFrame(tick)}
tick();

var logo=document.querySelector('.logo');
if(matchMedia('(hover:hover) and (min-width:900px)').matches){addEventListener('mousemove',function(e){
var x=(e.clientX/innerWidth-.5)*16,y=(e.clientY/innerHeight-.5)*16;
logo.style.transform='translate('+x+'px,'+y+'px)'})}

var lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
var promo=document.getElementById('promo');
var LIMITE=new Date(2026,8,11);
if(new Date()<LIMITE){
setTimeout(function(){promo.classList.add('on');pausar=true},900);
function pCerrar(){promo.classList.remove('on');pausar=false}
document.getElementById('pclose').addEventListener('click',pCerrar);
promo.addEventListener('click',function(e){if(e.target.closest('.pcard'))return;pCerrar()});

document.querySelectorAll('.flyer').forEach(function(f){
f.addEventListener('click',function(){
if(f.hasAttribute('data-promo')){promo.classList.add('on');pausar=true;return}

lbimg.src=im.currentSrc||im.src;
lbimg.alt=im.alt;
lb.classList.add('on');pausar=true})});
function cerrar(){lb.classList.remove('on');lbimg.removeAttribute('src');pausar=false}
lb.addEventListener('click',function(e){if(e.target.closest('.lb-cta'))return;cerrar()});
addEventListener('keydown',function(e){if(e.key==='Escape')cerrar()});

var rail=document.getElementById('rail'),track=document.getElementById('track'),dotsEl=document.getElementById('dots'),dots=dotsEl.children,tid;
var drag=false,dragMoved=false,dx0=0,dsl=0;
rail.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;drag=true;dragMoved=false;dx0=e.clientX;dsl=rail.scrollLeft});
addEventListener('pointermove',function(e){if(!drag)return;var d=e.clientX-dx0;if(Math.abs(d)>8)dragMoved=true;rail.scrollLeft=dsl-d});
addEventListener('pointerup',function(){drag=false});
rail.addEventListener('click',function(e){if(dragMoved){e.stopPropagation();e.preventDefault();dragMoved=false}},true);
function syncDots(){
if(rail.scrollWidth<=rail.clientWidth+2){dotsEl.classList.add('hide');return}
dotsEl.classList.remove('hide');
var cards=track.children,rr=rail.getBoundingClientRect(),mid=rr.left+rr.width/2,best=0,bd=Infinity;
for(var k=0;k<cards.length;k++){var cr=cards[k].getBoundingClientRect(),d=Math.abs(cr.left+cr.width/2-mid);
if(d<bd){bd=d;best=k}}
if(rail.scrollLeft<=2)best=0;
else if(rail.scrollLeft>=rail.scrollWidth-rail.clientWidth-2)best=cards.length-1;
for(var k=0;k<dots.length;k++)dots[k].className=k===best?'on':''}
rail.addEventListener('scroll',function(){clearTimeout(tid);tid=setTimeout(syncDots,90)},{passive:true});
addEventListener('resize',function(){clearTimeout(tid);tid=setTimeout(syncDots,120)});
syncDots();
})();
</script>
