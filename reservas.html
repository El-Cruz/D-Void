<div style="max-width:640px;margin:0 auto">
  <iframe
    id="dvoid-reservas"
    src="https://app-dvoid-prod-rdbpg.azurewebsites.net/reservar/embed"
    style="width:100%;border:0;display:block;height:900px"
    title="Reservas DVOID"
    loading="lazy"></iframe>
</div>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://app-dvoid-prod-rdbpg.azurewebsites.net') return;
    if (!e.data || e.data.tipo !== 'dvoid:alto') return;
    var f = document.getElementById('dvoid-reservas');
    if (f) f.style.height = e.data.alto + 'px';
  });
</script>
